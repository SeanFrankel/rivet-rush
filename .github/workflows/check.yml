name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node tools/check-docs.cjs
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          RIVET_ENGINE: firefox
      - run: node tools/release.cjs build .tmp/ci-release
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .tmp/ci-release
      - run: node tools/artifact-smoke.cjs .tmp/ci-release
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-rush-${{ github.sha }}
          path: .tmp/ci-release
          retention-days: 14
